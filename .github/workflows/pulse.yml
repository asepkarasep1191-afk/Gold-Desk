name: Pulse

# Keeps the desk scanning (and therefore pushing to the phone) every five
# minutes even when nobody has the app or the site open. The Worker throttles
# itself to one scan per window, so a late or repeated tick is harmless.
#
# GitHub's scheduler is best effort: under load a tick can run a few minutes
# late. It is still the only clock this project has, because Freebuff Sites
# does not run cron triggers.
on:
  schedule:
    # Minutes 2,7,12,… deliberately skip the top of the hour: GitHub documents
    # that scheduled runs are most often delayed or dropped at :00.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the scan
        run: |
          curl -sS --max-time 120 --retry 2 --retry-delay 5 \
            "https://site-4437c959d8254fd691c1439aa0122249.freebuff.page/api/pulse" \
            -o pulse.json
          head -c 2000 pulse.json; echo
